<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Конструктор дитячого резюме</title>
  <style>
    :root {
      --main-color: #2563eb;
      --main-gradient: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
      --bg-accent: #eff6ff;
      --border-gradient: linear-gradient(135deg, #2563eb, #93c5fd, #2563eb);
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
    .app-title { text-align: center; margin-bottom: 20px; color: #1e3a8a; font-size: 26px; font-weight: 800; }
    .container { display: flex; gap: 20px; max-width: 1350px; margin: 0 auto; flex-wrap: wrap; }
    
    /* Ліва панель введення */
    .form-panel { flex: 1; min-width: 360px; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .preview-panel { flex: 1.2; min-width: 420px; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
    
    h2 { margin-top: 0; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; color: #0f172a; font-size: 18px; }
    
    .theme-picker { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; }
    .theme-btn { width: 32px; height: 32px; border-radius: 50%; border: 3px solid white; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: transform 0.2s; }
    .theme-btn:hover { transform: scale(1.1); }
    
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #475569; }
    input[type="text"], textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; transition: border-color 0.2s; }
    input[type="text"]:focus, textarea:focus { border-color: var(--main-color); outline: none; }
    textarea { height: 55px; resize: vertical; }

    .btn-print { width: 100%; background: #10b981; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
    .btn-print:hover { background: #059669; }

    /* Сучасний макет резюме А4 з яскравою кольоровою рамкою */
    .resume-card { 
      background: #ffffff;
      border: 5px solid transparent;
      background-image: linear-gradient(#ffffff, #ffffff), var(--border-gradient);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      border-radius: 20px; 
      padding: 35px; 
      flex-grow: 1; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      min-height: 750px; 
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    /* Декоративна іконка в кутку */
    .resume-card::after {
      content: '🚀';
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 28px;
      opacity: 0.85;
    }

    .resume-header { text-align: center; border-bottom: 2px dashed #e2e8f0; padding-bottom: 20px; margin-bottom: 20px; }
    .header-badge {
      display: inline-block;
      background: var(--bg-accent);
      color: var(--main-color);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .resume-header h1 { margin: 0; color: #0f172a; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
    .resume-header p { margin: 6px 0 0; color: var(--main-color); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }

    .resume-content { display: flex; flex-direction: column; gap: 14px; flex-grow: 1; }
    
    .resume-block { 
      background: #ffffff; 
      border-radius: 12px; 
      padding: 12px 16px; 
      border: 1px solid #f1f5f9;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .resume-block h3 { 
      margin: 0 0 10px; 
      color: var(--main-color); 
      font-size: 14px; 
      font-weight: 700; 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      background: var(--bg-accent);
      padding: 4px 12px;
      border-radius: 8px;
      border-left: 3px solid var(--main-color);
    }
    
    /* Марковані списки для розділів */
    .resume-list { margin: 0; padding-left: 0; list-style: none; }
    .resume-list li { 
      position: relative; 
      padding-left: 22px; 
      margin-bottom: 5px; 
      font-size: 14px; 
      line-height: 1.5; 
      color: #334155; 
    }
    .resume-list li:last-child { margin-bottom: 0; }
    .resume-list li::before { 
      content: "⭐"; 
      position: absolute; 
      left: 0; 
      font-size: 11px; 
      top: 2px;
    }

    /* Блок "Моя мрія" на самому кінці сторінки */
    .dream-block {
      background: var(--bg-accent);
      border: 2px dashed var(--main-color);
      border-radius: 14px;
      padding: 16px 20px;
      margin-top: auto;
      position: relative;
    }
    .dream-block h3 { margin: 0 0 6px; color: var(--main-color); font-size: 15px; font-weight: 700; }
    .dream-block p { margin: 0; font-size: 14px; font-style: italic; color: #1e3a8a; line-height: 1.5; }

    /* Друк / Збереження у PDF з точним збереженням кольорів */
    @media print {
      @page { size: A4; margin: 8mm; }
      body { 
        background: white; 
        padding: 0; 
        margin: 0; 
        -webkit-print-color-adjust: exact; 
        print-color-adjust: exact; 
      }
      .form-panel, .app-title, .btn-print, .preview-panel h2 { display: none !important; }
      .container { display: block; width: 100%; margin: 0; padding: 0; }
      .preview-panel { padding: 0; border: none; box-shadow: none; }
      .resume-card { 
        border: 4px solid transparent;
        background-image: linear-gradient(#ffffff, #ffffff), var(--border-gradient);
        background-origin: border-box;
        background-clip: padding-box, border-box;
        border-radius: 12px; 
        padding: 18mm 14mm; 
        min-height: 275mm; 
        box-sizing: border-box; 
      }
      .dream-block { margin-top: auto; }
    }
  </style>
</head>
<body>

  <h1 class="app-title">Конструктор дитячого резюме</h1>

  <div class="container">
    <!-- Ліва панель: Введення даних -->
    <div class="form-panel">
      <h2>1. Стиль та кольори</h2>
      <div class="theme-picker">
        <div class="theme-btn" style="background: #2563eb;" onclick="setTheme('#2563eb', '#eff6ff', 'linear-gradient(135deg, #2563eb, #60a5fa, #2563eb)')"></div>
        <div class="theme-btn" style="background: #059669;" onclick="setTheme('#059669', '#ecfdf5', 'linear-gradient(135deg, #059669, #34d399, #059669)')"></div>
        <div class="theme-btn" style="background: #7c3aed;" onclick="setTheme('#7c3aed', '#f5f3ff', 'linear-gradient(135deg, #7c3aed, #a78bfa, #7c3aed)')"></div>
        <div class="theme-btn" style="background: #ea580c;" onclick="setTheme('#ea580c', '#fff7ed', 'linear-gradient(135deg, #ea580c, #fb923c, #ea580c)')"></div>
      </div>

      <h2>2. Основні дані</h2>
      <div class="form-group">
        <label>Ім'я та Прізвище:</label>
        <input type="text" id="inName" value="Олексій Шевченко" oninput="render()">
      </div>
      <div class="form-group">
        <label>Вік та Клас:</label>
        <input type="text" id="inClass" value="11 років, 6-Б клас" oninput="render()">
      </div>

      <h2>3. Вміст розділів (кожен пункт з нового рядка)</h2>
      
      <div class="form-group">
        <label>🎨 Мої захоплення:</label>
        <textarea id="inHobbies" oninput="render()"></textarea>
      </div>

      <div class="form-group">
        <label>⚡ Мої суперсили:</label>
        <textarea id="inSkills" oninput="render()"></textarea>
      </div>

      <div class="form-group">
        <label>🏆 Мої досягнення:</label>
        <textarea id="inAchievements" oninput="render()"></textarea>
      </div>

      <div class="form-group">
        <label>🤝 Волонтерство:</label>
        <textarea id="inVolunteering" oninput="render()"></textarea>
      </div>

      <div class="form-group">
        <label>🌟 Моя мрія:</label>
        <textarea id="inDream" oninput="render()"></textarea>
      </div>

      <button class="btn-print" onclick="window.print()">💾 Зберегти у PDF / Надрукувати</button>
    </div>

    <!-- Права панель: Прев'ю -->
    <div class="preview-panel">
      <h2>Попередній перегляд (Формат A4)</h2>
      <div class="resume-card">
        <div class="resume-header">
          <span class="header-badge">⭐ Учнівське резюме ⭐</span>
          <h1 id="outName">Олексій Шевченко</h1>
          <p id="outClass">11 років, 6-Б клас</p>
        </div>

        <div class="resume-content">
          <div class="resume-block">
            <h3>🎨 Мої захоплення</h3>
            <div id="outHobbies"></div>
          </div>

          <div class="resume-block">
            <h3>⚡ Мої суперсили</h3>
            <div id="outSkills"></div>
          </div>

          <div class="resume-block">
            <h3>🏆 Мої досягнення</h3>
            <div id="outAchievements"></div>
          </div>

          <div class="resume-block">
            <h3>🤝 Волонтерство</h3>
            <div id="outVolunteering"></div>
          </div>
        </div>

        <!-- Розділ "Моя мрія" закріплено в самому кінці -->
        <div class="dream-block">
          <h3>🌟 Моя мрія</h3>
          <p id="outDream"></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function setTheme(color, bg, borderGrad) {
      document.documentElement.style.setProperty('--main-color', color);
      document.documentElement.style.setProperty('--bg-accent', bg);
      document.documentElement.style.setProperty('--border-gradient', borderGrad);
    }

    function formatAsList(text) {
      if (!text || !text.trim()) return '<span style="color:#94a3b8; font-style:italic;">Заповніть поле ліворуч...</span>';
      const lines = text.split('\n').filter(line => line.trim() !== '');
      if (lines.length === 0) return '<span style="color:#94a3b8; font-style:italic;">Заповніть поле ліворуч...</span>';
      return '<ul class="resume-list">' + 
        lines.map(line => `<li>${line.trim()}</li>`).join('') + 
        '</ul>';
    }

    function render() {
      document.getElementById('outName').innerText = document.getElementById('inName').value || "Твоє Ім'я";
      document.getElementById('outClass').innerText = document.getElementById('inClass').value || "Вік / Клас";

      document.getElementById('outHobbies').innerHTML = formatAsList(document.getElementById('inHobbies').value);
      document.getElementById('outSkills').innerHTML = formatAsList(document.getElementById('inSkills').value);
      document.getElementById('outAchievements').innerHTML = formatAsList(document.getElementById('inAchievements').value);
      document.getElementById('outVolunteering').innerHTML = formatAsList(document.getElementById('inVolunteering').value);

      const dreamText = document.getElementById('inDream').value;
      document.getElementById('outDream').innerText = dreamText.trim() ? dreamText : "Заповніть поле ліворуч...";
    }

    render();
  </script>
</body>
</html>
